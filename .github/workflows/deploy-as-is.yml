name: Deploy As Is

on:
  workflow_call:
    inputs:
      domain:
        type: string
        required: true
      base-href:
        type: string
        required: true
    secrets:
      SERVER_HOST:
        required: true
      SERVER_USERNAME:
        required: true
      SERVER_PORT:
        required: true
      SERVER_SSH_KEY:
        required: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - name: Compress Artifact
        run: tar -czf artifact.tar.gz -C . .

      - uses: actions/upload-artifact@v7
        with:
          name: artifact
          path: artifact.tar.gz

  deploy:
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Run Commands on Server Using SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USERNAME }}
          port: ${{ secrets.SERVER_PORT }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          script: |
            APP_DIR="$HOME/websites/${{ inputs.domain }}"
            TEMP_DIR="$HOME/websites/.temp/${{ inputs.domain }}"

            mkdir -p "$TEMP_DIR"
            rm -rf "$TEMP_DIR/*"

            mkdir -p "$APP_DIR"
            rm -rf "$APP_DIR/*"

            gh run download ${{ github.run_id }} -R ${{ github.repository }} -n artifact -D "$TEMP_DIR"

            tar -xzf "$TEMP_DIR/artifact.tar.gz" -C "$APP_DIR"
            rm -rf "TEMP_DIR"

            cd "$APP_DIR"

            rm -rf /var/www/${{ inputs.domain }}/html${{ inputs.base-href }}
            mkdir -p /var/www/${{ inputs.domain }}/html${{ inputs.base-href }}
            mv ./* /var/www/${{ inputs.domain }}/html${{ inputs.base-href }}
