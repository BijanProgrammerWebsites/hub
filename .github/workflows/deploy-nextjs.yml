name: Deploy Next.js

on:
  workflow_call:
    inputs:
      process-name:
        required: true
        type: string
      port:
        required: true
        type: string

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "npm"

      - name: Install Dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Prepare Artifact
        run: |
          [ -d public ] && cp -r public .next/standalone/
          [ -d .next/static ] && mkdir -p .next/standalone/.next
          [ -d .next/static ] && cp -r .next/static .next/standalone/.next/

      - name: Compress Artifact
        run: tar -czf artifact.tar.gz -C .next/standalone .

      - uses: actions/upload-artifact@v4
        with:
          name: artifact
          path: artifact.tar.gz

  deploy:
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Run Commands on Server Using SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USERNAME }}
          port: ${{ secrets.SERVER_PORT }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          script: |
            APP_DIR="$HOME/websites/${{ inputs.process-name }}"
            TEMP_DIR="$HOME/websites/.temp/${{ inputs.process-name }}"

            mkdir -p "$TEMP_DIR"
            rm -rf "$TEMP_DIR"/*

            mkdir -p "$APP_DIR"
            rm -rf "$APP_DIR"/*

            gh run download ${{ github.run_id }} -R ${{ github.repository }} -n artifact -D "$TEMP_DIR"

            tar -xzf "$TEMP_DIR/artifact.tar.gz" -C "$APP_DIR"

            printf '%s' "${{ secrets.ENV_FILE }}" > "$APP_DIR/.env"
            printf '%s' "${{ secrets.ENV_LOCAL_FILE }}" > "$APP_DIR/.env.local"

            cd "$APP_DIR"

            if pm2 describe "${{ inputs.process-name }}" >/dev/null 2>&1; then
              PORT=${{ inputs.port }} pm2 restart "${{ inputs.process-name }}" --update-env
            else
              PORT=${{ inputs.port }} pm2 start server.js --name "${{ inputs.process-name }}"
            fi

            pm2 save

            rm -rf "TEMP_DIR"
