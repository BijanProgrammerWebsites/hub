name: Deploy Next.js

on:
  workflow_call:
    inputs:
      process-name:
        required: true
        type: string
      port:
        required: true
        type: string

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 11

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: pnpm

      - name: Install Dependencies
        run: pnpm ci

      - name: Build
        run: pnpm build

      - name: Prepare Artifact
        run: |
          [ -d public ] && cp -r public .next/standalone/
          [ -d .next/static ] && mkdir -p .next/standalone/.next
          [ -d .next/static ] && cp -r .next/static .next/standalone/.next/

      - name: Compress Artifact
        run: tar -czf artifact.tar.gz -C .next/standalone .

      - uses: actions/upload-artifact@v4
        with:
          name: artifact
          path: artifact.tar.gz

  deploy:
    runs-on: ubuntu-latest
    needs: build

    steps:
      - uses: actions/download-artifact@v4
        with:
          name: artifact

      - name: Upload Artifact
        uses: appleboy/scp-action@v1
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          port: ${{ secrets.SERVER_PORT }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          source: artifact.tar.gz
          target: ~/websites/.temp/${{ inputs.process-name }}

      - name: Deploy
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          port: ${{ secrets.SERVER_PORT }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          script: |
            APP_DIR="$HOME/websites/${{ inputs.process-name }}"
            TEMP_DIR="$HOME/websites/.temp/${{ inputs.process-name }}"
            ARTIFACT="$TEMP_DIR/artifact.tar.gz"

            mkdir -p "$APP_DIR"
            mkdir -p "$TEMP_DIR"

            rm -rf "$APP_DIR"/*

            tar -xzf "$ARTIFACT" -C "$APP_DIR"

            printf '%s' "${{ secrets.ENV_FILE }}" > "$APP_DIR/.env"
            printf '%s' "${{ secrets.ENV_LOCAL_FILE }}" > "$APP_DIR/.env.local"

            cd "$APP_DIR"

            if pm2 describe "${{ inputs.process-name }}" >/dev/null 2>&1; then
              pm2 restart "${{ inputs.process-name }}"
            else
              PORT=${{ inputs.port }} pm2 start server.js --name "${{ inputs.process-name }}"
            fi

            pm2 save

            rm -f "$ARTIFACT"
