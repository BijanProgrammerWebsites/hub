name: Deploy Astro
on:
  workflow_call:
    inputs:
      host:
        required: true
        type: string
      base-href:
        required: true
        type: string

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "npm"

      - name: Install Dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Compress Artifact
        run: tar -czf artifact.tar.gz -C dist .

      - uses: actions/upload-artifact@v4
        with:
          name: artifact
          path: artifact.tar.gz

  deploy:
    runs-on: ubuntu-latest
    needs: build

    steps:
      - uses: actions/download-artifact@v4
        with:
          name: artifact

      - name: Configure SSH key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SERVER_SSH_KEY }}" > ~/.ssh/id_server
          chmod 600 ~/.ssh/id_server

      - name: Move Artifact to Server
        run: |
          rsync -v \
            -e "ssh \
              -i ~/.ssh/id_server \
              -o StrictHostKeyChecking=no \
              -o Compression=no \
              -o PreferredAuthentications=publickey \
              -p ${{ secrets.SERVER_PORT }}" \
            artifact.tar.gz \
            ${{ secrets.SERVER_USERNAME }}@${{ secrets.SERVER_HOST }}:~/websites/.temp/${{ inputs.host }}

      - name: SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USERNAME }}
          port: ${{ secrets.SERVER_PORT }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          script: |
            APP_DIR="$HOME/websites/${{ inputs.host }}"
            ARTIFACT="$HOME/websites/.temp/${{ inputs.host }}/artifact.tar.gz"

            mkdir -p "$APP_DIR"
            rm -rf "$APP_DIR"/*

            tar -xzf "$ARTIFACT" -C "$APP_DIR"

            cd "$APP_DIR"

            rm -rf /var/www/${{ inputs.host }}/html${{ inputs.base-href }}
            mkdir -p /var/www/${{ inputs.host }}/html${{ inputs.base-href }}
            mv ./* /var/www/${{ inputs.host }}/html${{ inputs.base-href }}

            rm -f "$ARTIFACT"
