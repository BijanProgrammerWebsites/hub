name: Deploy Astro
on:
  workflow_call:
    inputs:
      host:
        required: true
        type: string
      base-href:
        required: true
        type: string

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "npm"

      - name: Install Dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Compress Artifact
        run: tar -czf artifact.tar.gz -C dist .

      - uses: actions/upload-artifact@v4
        with:
          name: artifact
          path: artifact.tar.gz

  deploy:
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Run Commands on Server Using SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USERNAME }}
          port: ${{ secrets.SERVER_PORT }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          script: |
            APP_DIR="$HOME/websites/${{ inputs.host }}"
            TEMP_DIR="$HOME/websites/.temp/${{ inputs.host }}"

            mkdir -p "$TEMP_DIR"
            rm -rf "$TEMP_DIR"/*

            mkdir -p "$APP_DIR"
            rm -rf "$APP_DIR"/*

            gh run download ${{ github.run_id }} -R ${{ github.repository }} -n artifact -D "$TEMP_DIR"

            tar -xzf "$TEMP_DIR/artifact.tar.gz" -C "$APP_DIR"

            cd "$APP_DIR"

            rm -rf /var/www/${{ inputs.host }}/html${{ inputs.base-href }}
            mkdir -p /var/www/${{ inputs.host }}/html${{ inputs.base-href }}
            mv ./* /var/www/${{ inputs.host }}/html${{ inputs.base-href }}

            rm -rf "TEMP_DIR"
